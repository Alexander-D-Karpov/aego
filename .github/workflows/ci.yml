name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  GLSLANG_APT_VERSION: 15.1.0-2~ubuntu0.24.04.2
  SDL_AUDIO_DRIVER: dummy
  SDL_AUDIODRIVER: dummy
  LINUX_PKGS: >-
    build-essential cmake ninja-build pkg-config openssl
    libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev
    libwayland-dev wayland-protocols libdecor-0-dev
    libasound2-dev libpulse-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev libibus-1.0-dev

jobs:
  # Build and test one Studio snapshot in the same job as the full regression.
  # Native authoring uses a separate clean checkout; build runs even on failure.
  checks:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    container:
      image: git.akarpov.ru/sanspie/aego-ci-env@sha256:333d35cd33c2813e4a4ed9c1499344e036d3c67b5e0818da87ad5717d1e14d50
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    env:
      AEGO_CI_PREPARED: "1"
      ARTSTUDIO_PYTHON: /opt/aego/python/bin/python
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      GOTOOLCHAIN: local
    outputs:
      manifest_sha256: ${{ steps.snapshot_pin.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify prepared CI environment
        run: |
          set -euo pipefail
          python3 -B tools/ci/prepare_ci_workspace.py --root "$PWD"
          python3 -B tools/ci/env/preflight.py --root "$PWD"
          bash tools/check-glslang.sh
      - run: bash tools/bootstrap-native.sh
      - name: Test worktree evidence inventory
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/ci -p worktree_manifest_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/ci -p test_component_try_evidence.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/ci -p test_integration_race.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/ci -p test_artstudio_native_evidence.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/ci -p test_protocol_install.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/ci -p test_ci_regression_stream.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/ci -p test_ci_native_stream.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/ci -p test_ci_snapshot_handoff.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/ci -p test_native_artifacts_guard.py
      - name: Identify Go build cache
        id: go_cache_key
        continue-on-error: true
        run: python3 -B tools/ci/go_cache_key.py
      - name: Restore Go build cache
        id: go_cache
        if: ${{ steps.go_cache_key.outputs.fingerprint != '' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            ${{ steps.go_cache_key.outputs.path }}
            ${{ steps.go_cache_key.outputs.modules }}
          key: aego-go-v1-${{ steps.go_cache_key.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            aego-go-v1-${{ steps.go_cache_key.outputs.fingerprint }}-
      - name: Asset Studio snapshot and real browser integration
        id: artstudio_snapshot
        env:
          ARTSTUDIO_SNAPSHOT_CORE: defer-to-make-ci
        run: |
          export ARTSTUDIO_PYTHON="${ARTSTUDIO_PYTHON:-$RUNNER_TEMP/aego-artstudio-python/bin/python}"
          export ARTSTUDIO_SNAPSHOT_DIR="$RUNNER_TEMP/aego-artstudio-evidence"
          bash tools/ci/artstudio_snapshot_e2e.sh
      - name: Pin the tested Studio snapshot
        id: snapshot_pin
        run: |
          set -euo pipefail
          [[ "$(cat "$RUNNER_TEMP/aego-artstudio-evidence/head.txt")" == "$GITHUB_SHA" ]]
          sha="$(cat "$RUNNER_TEMP/aego-artstudio-evidence/manifest.sha256")"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      # The stock v4 GitHub action may reject Gitea as GHES on older runners.
      # This pinned Gitea-compatible fork uploads even a failed run's evidence.
      - name: Preserve Asset Studio snapshot evidence
        if: ${{ always() }}
        uses: https://github.com/ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: asset-studio-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/aego-artstudio-evidence/*.log
            ${{ runner.temp }}/aego-artstudio-evidence/*.exit
            ${{ runner.temp }}/aego-artstudio-evidence/*.txt
            ${{ runner.temp }}/aego-artstudio-evidence/*.json
            ${{ runner.temp }}/aego-artstudio-evidence/*.sha256
            ${{ runner.temp }}/aego-artstudio-evidence/artifact/**
            ${{ runner.temp }}/aego-artstudio-evidence/site/asset-studio/**
            ${{ runner.temp }}/aego-artstudio-evidence/chromium-browser/**
            ${{ runner.temp }}/aego-artstudio-evidence/firefox-browser/**
            ${{ runner.temp }}/aego-artstudio-evidence/chromium-gpu-browser/**
            ${{ runner.temp }}/aego-artstudio-evidence/firefox-gpu-browser/**
            ${{ runner.temp }}/aego-artstudio-evidence/parity-replay/*.json

      - name: Verify Studio snapshot before regression
        env:
          EXPECTED_STUDIO_MANIFEST: ${{ steps.snapshot_pin.outputs.sha256 }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/aego-artstudio-evidence"
          [[ "$EXPECTED_STUDIO_MANIFEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(cat "$dir/manifest.sha256")" == "$EXPECTED_STUDIO_MANIFEST" ]]
          [[ "$(cat "$dir/head.txt")" == "$GITHUB_SHA" && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1], encoding="utf-8")); sys.exit(0 if m.get("commit") == sys.argv[2] and m.get("release") is False else "snapshot identity mismatch")' "$dir/artifact/manifest.json" "$GITHUB_SHA"
          go run ./tools/artstudio/release verify -dir "$dir/artifact" -sha256 "$EXPECTED_STUDIO_MANIFEST"
          go run ./tools/artstudio/release check-source -root "$PWD" -dir "$dir/artifact"
      - name: Full Aego regression and component Try
        env:
          AEGO_TRY_FIREFOX_HEADED: "1"
        run: |
          set -euo pipefail
          case "${AEGO_CI_PREPARED:-0}" in
            0) (cd tools/websmoke && npm ci --no-audit --no-fund) ;;
            1) python3 -B tools/ci/prepared_web_deps.py --root "$PWD" ;;
            *) echo 'Invalid AEGO_CI_PREPARED value' >&2; exit 2 ;;
          esac
          chromium="$(cd tools/websmoke && node -e 'console.log(require("playwright-core").chromium.executablePath())')"
          firefox="$(cd tools/websmoke && node -e 'console.log(require("playwright-core").firefox.executablePath())')"
          [[ -f "$firefox" && -x "$firefox" ]] || { echo "Playwright Firefox executable is missing: $firefox" >&2; exit 1; }
          # The visibility gate launches a real headed browser without a
          # Playwright connection, so it cannot discover the cached binary.
          export FIREFOX="$firefox"
          export ARTSTUDIO_ARTIFACT="$RUNNER_TEMP/aego-artstudio-evidence/artifact"
          export ARTSTUDIO_MANIFEST_SHA256="$(cat "$RUNNER_TEMP/aego-artstudio-evidence/manifest.sha256")"
          export ARTSTUDIO_PYTHON="${ARTSTUDIO_PYTHON:-$RUNNER_TEMP/aego-artstudio-python/bin/python}"
          [[ "$(cat "$RUNNER_TEMP/aego-artstudio-evidence/core-deferred.txt")" == 'Deferred: required make ci must run studio-web-test.' ]]
          mkdir -p "$RUNNER_TEMP/aego-full-ci"
          set +e
          # Stream as well as save the log: a runner timeout can terminate the
          # job before an always() artifact step or a final tail gets to run.
          xvfb-run -a -s '-screen 0 1440x1050x24' make ci XVFB= CHROMIUM="$chromium" 2>&1 \
            | tee "$RUNNER_TEMP/aego-full-ci/make-ci.log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          result="${pipeline_status[0]}"
          printf '%s\n' "$result" >"$RUNNER_TEMP/aego-full-ci/make-ci.exit"
          if [ "${pipeline_status[1]}" -ne 0 ]; then
            echo "Failed to stream or save the full CI log (tee exit ${pipeline_status[1]})" >&2
            exit "${pipeline_status[1]}"
          fi
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          python3 -B tools/ci/component_try_evidence.py verify --root "$PWD" \
            --report .cache/component-try.json --evidence .cache/component-try-evidence \
            --wasm site/try/aego-docs.wasm --output "$RUNNER_TEMP/aego-full-ci/component-try-verified.json"
      - name: Preserve full CI and component evidence
        if: ${{ always() }}
        uses: https://github.com/ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: aego-full-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/aego-full-ci/**
            .cache/component-try.json*
            .cache/component-try-evidence/**
            .cache/component-try-evidence-negative/**
            .cache/integration-race/**
            site/try/aego-docs.wasm
      - name: Check optional Go cache upload
        id: go_cache_size
        if: ${{ success() && steps.go_cache_key.outputs.fingerprint != '' && steps.go_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        env:
          GO_BUILD_CACHE_PATH: ${{ steps.go_cache_key.outputs.path }}
          GO_MODULE_CACHE_PATH: ${{ steps.go_cache_key.outputs.modules }}
        run: python3 -B tools/ci/go_cache_save.py
      - name: Save Go build cache
        if: ${{ success() && steps.go_cache_size.outputs.save == 'yes' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ${{ steps.go_cache_key.outputs.path }}
            ${{ steps.go_cache_key.outputs.modules }}
          key: aego-go-v1-${{ steps.go_cache_key.outputs.fingerprint }}-${{ github.sha }}

  native-authoring:
    needs: checks
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-24.04
    container:
      image: git.akarpov.ru/sanspie/aego-ci-env@sha256:333d35cd33c2813e4a4ed9c1499344e036d3c67b5e0818da87ad5717d1e14d50
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    env:
      AEGO_CI_PREPARED: "1"
      ARTSTUDIO_PYTHON: /opt/aego/python/bin/python
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Verify prepared CI environment
        run: |
          set -euo pipefail
          python3 -B tools/ci/prepare_ci_workspace.py --root "$PWD"
          python3 -B tools/ci/env/preflight.py --root "$PWD"
          bash tools/check-glslang.sh
      - run: bash tools/bootstrap-native.sh
      - name: Identify Go build cache
        id: go_cache_key
        continue-on-error: true
        run: python3 -B tools/ci/go_cache_key.py
      - name: Restore Go build cache
        id: go_cache
        if: ${{ steps.go_cache_key.outputs.fingerprint != '' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            ${{ steps.go_cache_key.outputs.path }}
            ${{ steps.go_cache_key.outputs.modules }}
          key: aego-go-v1-${{ steps.go_cache_key.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            aego-go-v1-${{ steps.go_cache_key.outputs.fingerprint }}-
      - name: Download the tested Studio snapshot
        uses: https://github.com/ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7
        with:
          name: asset-studio-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aego-artstudio-evidence
      - name: Verify Studio snapshot before native authoring
        env:
          EXPECTED_STUDIO_MANIFEST: ${{ needs.checks.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/aego-artstudio-evidence"
          [[ "$EXPECTED_STUDIO_MANIFEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(cat "$dir/manifest.sha256")" == "$EXPECTED_STUDIO_MANIFEST" ]]
          [[ "$(cat "$dir/head.txt")" == "$GITHUB_SHA" && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1], encoding="utf-8")); sys.exit(0 if m.get("commit") == sys.argv[2] and m.get("release") is False else "snapshot identity mismatch")' "$dir/artifact/manifest.json" "$GITHUB_SHA"
          go run ./tools/artstudio/release verify -dir "$dir/artifact" -sha256 "$EXPECTED_STUDIO_MANIFEST"
          go run ./tools/artstudio/release check-source -root "$PWD" -dir "$dir/artifact"
      - name: Native authoring and installed Linux protocol
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aego-full-ci"
          run_gate() {
            local name="$1"; shift
            local started finished start_seconds elapsed code
            local -a statuses
            [[ "$name" =~ ^[a-z0-9-]+$ && "$GITHUB_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            start_seconds=$SECONDS
            printf '%s\n' RUNNING >"$RUNNER_TEMP/aego-full-ci/$name.exit"
            printf '%s: started %s (log: %s)\n' "$name" "$started" "$RUNNER_TEMP/aego-full-ci/$name.log"
            set +e
            "$@" 2>&1 | tee "$RUNNER_TEMP/aego-full-ci/$name.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            code="${statuses[0]}"
            if ((code == 0 && statuses[1] != 0)); then code="${statuses[1]}"; fi
            finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            elapsed=$((SECONDS - start_seconds))
            printf '%s\n' "${statuses[0]}" >"$RUNNER_TEMP/aego-full-ci/$name.command.exit"
            printf '%s\n' "${statuses[1]}" >"$RUNNER_TEMP/aego-full-ci/$name.stream.exit"
            printf '%s\n' "$code" >"$RUNNER_TEMP/aego-full-ci/$name.exit"
            printf '{"suite_id":"%s","source_sha":"%s","environment_digest":null,"started_at":"%s","finished_at":"%s","duration_seconds":%s,"exit_code":%s,"command_exit_code":%s,"stream_exit_code":%s,"cache_status":"unmeasured"}\n' \
              "$name" "$GITHUB_SHA" "$started" "$finished" "$elapsed" "$code" "${statuses[0]}" "${statuses[1]}" >"$RUNNER_TEMP/aego-full-ci/$name.timing.json"
            printf '%s: exit %s after %ss (%s)\n' "$name" "$code" "$elapsed" "$RUNNER_TEMP/aego-full-ci/$name.log"
            return "$code"
          }
          run_gate native-user-scenario env SDL_VIDEODRIVER=offscreen \
            AEGO_NATIVE_SCENARIO_EVIDENCE="$RUNNER_TEMP/aego-full-ci/native-sdl" \
            bash tools/acceptance-check.sh artstudio-native
          run_gate file-interoperability env SDL_VIDEODRIVER=offscreen \
            "${ARTSTUDIO_PYTHON:-$RUNNER_TEMP/aego-artstudio-python/bin/python}" tools/artstudio/release/tests/file_interop_e2e.py \
            --artifact "$RUNNER_TEMP/aego-artstudio-evidence/artifact" \
            --native-evidence "$RUNNER_TEMP/aego-full-ci/native-sdl" \
            --evidence "$RUNNER_TEMP/aego-full-ci/file-interop" \
            --app-url http://127.0.0.1:8097/ --serve-artifact
          run_gate remote-examples make remote-examples-check XVFB= \
            REMOTE_EXAMPLES_OUT="$RUNNER_TEMP/aego-full-ci/remote-protocol"
      - name: Preserve native authoring evidence
        if: ${{ always() }}
        uses: https://github.com/ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: aego-native-authoring-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/aego-full-ci/**
      - name: packaging tools
        run: command -v makensis && command -v mksquashfs
      - name: installer dry run
        run: make nsis-check
      - name: Check optional Go cache upload
        id: go_cache_size
        if: ${{ success() && steps.go_cache_key.outputs.fingerprint != '' && steps.go_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        env:
          GO_BUILD_CACHE_PATH: ${{ steps.go_cache_key.outputs.path }}
          GO_MODULE_CACHE_PATH: ${{ steps.go_cache_key.outputs.modules }}
        run: python3 -B tools/ci/go_cache_save.py
      - name: Save Go build cache
        if: ${{ success() && steps.go_cache_size.outputs.save == 'yes' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ${{ steps.go_cache_key.outputs.path }}
            ${{ steps.go_cache_key.outputs.modules }}
          key: aego-go-v1-${{ steps.go_cache_key.outputs.fingerprint }}-${{ github.sha }}

  build:
    # Run after the other jobs even on failure, without overlapping heavy work.
    needs: [checks, native-authoring]
    if: ${{ always() && github.server_url != 'https://github.com' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, goos: linux, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    container:
      image: git.akarpov.ru/sanspie/aego-ci-env@sha256:333d35cd33c2813e4a4ed9c1499344e036d3c67b5e0818da87ad5717d1e14d50
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "1"
      AEGO_CI_PREPARED: "1"
      ARTSTUDIO_PYTHON: /opt/aego/python/bin/python
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Verify prepared CI environment
        run: |
          set -euo pipefail
          python3 -B tools/ci/prepare_ci_workspace.py --root "$PWD"
          python3 -B tools/ci/env/preflight.py --root "$PWD"
          bash tools/check-glslang.sh
      - name: msys2
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: mingw path
        if: runner.os == 'Windows'
        run: echo "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> "$GITHUB_PATH"
      - name: macos tools
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - name: bootstrap native
        run: bash tools/bootstrap-native.sh
      - name: Identify Go build cache
        id: go_cache_key
        continue-on-error: true
        run: python3 -B tools/ci/go_cache_key.py
      - name: Restore Go build cache
        id: go_cache
        if: ${{ steps.go_cache_key.outputs.fingerprint != '' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            ${{ steps.go_cache_key.outputs.path }}
            ${{ steps.go_cache_key.outputs.modules }}
          key: aego-go-v1-${{ steps.go_cache_key.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            aego-go-v1-${{ steps.go_cache_key.outputs.fingerprint }}-
      - name: build
        run: go build ./...
      - name: test
        run: go test -count=1 ./...
      - name: test without native backends
        run: go test -count=1 -tags aego_nonative $(go list ./... | grep -v -e '/platform/sdl$' -e '/gpu/gl33$' -e '/gpu/gl33/gl$')
      - name: gl tests (offscreen, llvmpipe)
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: go test -count=1 -tags aego_gltest ./tests/gl/
      - name: golden
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: go test -count=1 -tags aego_golden ./tests/golden/...
      - name: headless smoke
        run: go run ./cmd/sandbox --demo headless --frames 600 --strict-allocs
      - name: build the cli
        run: go build -o /tmp/aego ./cmd/aego
      - name: cli smoke
        run: |
          /tmp/aego new /tmp/clitest
          /tmp/aego import /tmp/clitest
          /tmp/aego check /tmp/clitest
          /tmp/aego run /tmp/clitest --headless --frames 60
      - name: example project
        run: |
          /tmp/aego check examples/native-rotator
          /tmp/aego run examples/native-rotator --headless --frames 60
      - name: Check optional Go cache upload
        id: go_cache_size
        if: ${{ success() && steps.go_cache_key.outputs.fingerprint != '' && steps.go_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        env:
          GO_BUILD_CACHE_PATH: ${{ steps.go_cache_key.outputs.path }}
          GO_MODULE_CACHE_PATH: ${{ steps.go_cache_key.outputs.modules }}
        run: python3 -B tools/ci/go_cache_save.py
      - name: Save Go build cache
        if: ${{ success() && steps.go_cache_size.outputs.save == 'yes' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ${{ steps.go_cache_key.outputs.path }}
            ${{ steps.go_cache_key.outputs.modules }}
          key: aego-go-v1-${{ steps.go_cache_key.outputs.fingerprint }}-${{ github.sha }}

  release:
    needs: [checks, native-authoring, build]
    # Pause all automatic releases until the reviewed nightly/stable pipeline
    # enforces native gates and preserves existing tags and release assets.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CGO_ENABLED: "1"
      GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # the key that signs release.json and the public half the binaries trust; without them no release.json is published (D362)
      AEGO_RELEASE_KEY: ${{ secrets.AEGO_RELEASE_KEY }}
      AEGO_UPDATE_KEY: ${{ vars.AEGO_UPDATE_KEY || secrets.AEGO_UPDATE_KEY }}
      GITEA_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: linux packages
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PKGS "glslang-tools=$GLSLANG_APT_VERSION" && bash tools/check-glslang.sh
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .cache/native
