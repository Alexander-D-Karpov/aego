<!doctype html>
<meta charset="utf-8">
<title>Aego GPU integration</title>
<link rel="icon" href="data:,">
<style>body{font:14px system-ui;background:#222;color:#eee}canvas{image-rendering:pixelated}</style>
<h1>Aego WebGL2 GPU integration</h1>
<canvas id="surface" width="32" height="32"></canvas>
<script src="wasm_exec.js"></script>
<script>
const go = new Go();
WebAssembly.instantiateStreaming(fetch("gpu.wasm"), go.importObject)
  .then(({instance}) => go.run(instance))
  .catch(error => globalThis.aegoGPUResults = JSON.stringify({failures:[String(error)],passed:[]}));
</script>
