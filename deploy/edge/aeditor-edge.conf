# Dedicated Asset Studio edge vhost. No query-string access log and no proxy
# cache: session tokens must not be written to the shared nginx cache. Releases
# and content hashes are immutable, but the origin remains authoritative.
server {
    include snippets/maintenance.conf;
    listen 127.0.0.1:18443 ssl proxy_protocol;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    server_name aeditor.akarpov.ru;
    ssl_certificate /etc/letsencrypt/live/akarpov-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akarpov-wildcard/privkey.pem;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    access_log off;
    client_max_body_size 1k;

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass https://ru_origin;
        proxy_ssl_server_name on;
        proxy_ssl_name aeditor.akarpov.ru;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host aeditor.akarpov.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
