# Dedicated Asset Studio edge. A separately verified copy of each immutable
# release is served locally, so the app does not depend on the origin route.
# No query-string access log: transfer session tokens must not be logged.
map $uri $aeditor_edge_cache {
    default "no-cache";
    "~\.[a-f0-9]{16}\.(js|css|wasm|png)(\.gz)?$" "public, max-age=31536000, immutable";
}
map $uri $aeditor_edge_csp {
    default "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    ~^/(r/[A-Za-z0-9._-]+/)?embed/ "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://aego.akarpov.ru https://aeditor.akarpov.ru";
    ~^/(r/[A-Za-z0-9._-]+/)?docs/ "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src https://aeditor.akarpov.ru blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
}
server {
    listen 80;
    listen [::]:80;
    server_name aeditor.akarpov.ru;
    return 301 https://aeditor.akarpov.ru$request_uri;
}
server {
    include snippets/maintenance.conf;
    listen 127.0.0.1:18443 ssl proxy_protocol;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    server_name aeditor.akarpov.ru;
    ssl_certificate /etc/letsencrypt/live/akarpov-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akarpov-wildcard/privkey.pem;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    root /var/www/aego-asset-studio/current;
    index index.html;
    autoindex off;
    server_tokens off;
    access_log off;
    client_max_body_size 1k;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types application/wasm application/json text/javascript application/javascript text/css;
    add_header Content-Security-Policy $aeditor_edge_csp always;
    add_header Cache-Control $aeditor_edge_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    error_page 404 = @aeditor_edge_not_found;
    location ~ (^|/)\. { return 404; }
    location /r/ {
        alias /var/www/aego-asset-studio/releases/;
        limit_except GET HEAD { deny all; }
    }
    location / {
        try_files $uri $uri/index.html =404;
        limit_except GET HEAD { deny all; }
    }
    location @aeditor_edge_not_found {
        types { }
        default_type text/plain;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 404 "Asset Studio resource not found\n";
    }
}
