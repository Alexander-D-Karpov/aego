server {
    listen 80;
    root /usr/share/nginx/html;
    gzip_static on;
    gzip_vary on;
    absolute_redirect off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri.html $uri/ =404;
    }
}
